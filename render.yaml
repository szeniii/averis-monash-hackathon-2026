# Render blueprint. New > Blueprint, point it at this repo, pick the branch.
services:
  - type: web
    name: sdoc-verification
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set this in the Render dashboard, never in this file. Without it the
      # service still runs: stage 2 falls back to label matching.
      - key: GEMINI_API_KEY
        sync: false
